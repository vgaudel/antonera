<mat-toolbar 
    class="header-v2" 
    [style.--couleur-ombre]="preferenceService.couleurPreferee()">

  <!-- Logo + titre -->
  <span class="brand" (click)="goToWelcome()">
    <img src="beard.svg" alt="logo" width="30px" height="30px" />
    <b>{{ titleHeader() | titlecase }}</b>
  </span>

  <span class="spacer"></span>

  <nav class="links">
    @for(link of navLinks; track $index){
        <a
            mat-button
            [routerLink]="link.path"
            routerLinkActive="active">
            {{link.label}}
        </a>
    }
  </nav>

  <button
    mat-icon-button
    class="burger"
    [matMenuTriggerFor]="mobileMenu"
    aria-label="Ouvrir le menu de navigation">
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #mobileMenu="matMenu">
     @for(link of navLinks; track $index){
        <a
            mat-menu-item
            [routerLink]="link.path"
            routerLinkActive="active">
            {{link.label}}
        </a>
    }
  </mat-menu>


</mat-toolbar>
